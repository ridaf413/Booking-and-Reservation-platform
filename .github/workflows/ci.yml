name: Reservation invariant and full demo
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGO_URL: mongodb://127.0.0.1:27017/roomly_ci?replicaSet=rs0&directConnection=true
      TEST_MONGO_URL: mongodb://127.0.0.1:27017/roomly_test?replicaSet=rs0&directConnection=true
      PAYMENT_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker compose up -d mongo redis mailpit --wait
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
      - run: docker compose down
        if: always()
